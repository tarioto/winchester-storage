name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Default to read-only; the deploy job opts into id-token for OIDC.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --run

      - name: Build static files
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy static files to S3 bucket
        run: |
          # Root files (index.html, favicon, manifest) are not fingerprinted —
          # must revalidate so new deploys are picked up. assets/* is excluded
          # here so this pass never touches or deletes the fingerprinted bundle.
          aws s3 sync ./dist/ s3://${{ secrets.AWS_S3_BUCKET }} --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"
          # Vite fingerprints everything under assets/ — safe to cache forever.
          aws s3 sync ./dist/assets/ s3://${{ secrets.AWS_S3_BUCKET }}/assets/ --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
